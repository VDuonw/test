<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>View Order Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .order-details { background-color: #f8f9fa; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .order-details h5 { margin-bottom: 15px; }
        .action-btn { margin-right: 5px; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>View Order Request: <span th:text="${order.orderCode}"></span></h2>

        <!-- Hiển thị thông tin đơn hàng -->
        <div class="order-details">
            <h5>Order Details</h5>
            <div class="row">
                <div class="col-md-6">
                    <p><strong>Pickup Address:</strong> <span th:text="${order.pickupAddress}"></span></p>
                    <p><strong>Delivery Address:</strong> <span th:text="${order.deliveryAddress}"></span></p>
                    <p><strong>Item Description:</strong> <span th:text="${order.itemDescription}"></span></p>
                </div>
                <div class="col-md-6">
                    <p><strong>Weight:</strong> <span th:text="${order.weight != null ? order.weight : 'N/A'}"></span> kg</p>
                    <p><strong>Status:</strong> <span th:text="${order.status}"></span></p>
                    <p><strong>Preferred Pickup Time:</strong> <span th:text="${#dates.format(order.preferredPickupTime, 'dd/MM/yyyy HH:mm')}" th:if="${order.preferredPickupTime != null}">N/A</span></p>
                </div>
            </div>
        </div>

        <!-- Hành động -->
        <div class="mb-3">
            <a th:href="@{/receptionist/create-survey-form(orderId=${order.orderId})}" class="btn btn-success btn-sm action-btn">Create Survey</a>
            <a th:href="@{/receptionist/dashboard}" class="btn btn-secondary btn-sm action-btn">Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
