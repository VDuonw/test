<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Survey Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { max-width: 700px; margin-top: 50px; }
        .form-label { font-weight: bold; }
        .btn-group .btn { margin-right: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4">Create Survey for Order: <span th:text="${order.orderCode}"></span></h2>

        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <span th:text="${errorMessage}"></span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success" role="alert">
            <span th:text="${successMessage}"></span>
        </div>

        <div class="card p-4 shadow-sm">
            <h5 class="card-title mb-3">Order Details</h5>
            <div class="row">
                <div class="col-md-6">
                    <p><strong>Pickup Address:</strong> <span th:text="${order.pickupAddress ?: 'N/A'}"></span></p>
                    <p><strong>Delivery Address:</strong> <span th:text="${order.deliveryAddress ?: 'N/A'}"></span></p>
                    <p><strong>Item Description:</strong> <span th:text="${order.itemDescription ?: 'N/A'}"></span></p>
                </div>
                <div class="col-md-6">
                    <p><strong>Weight:</strong> <span th:text="${order.weight != null ? order.weight + ' kg' : 'N/A'}"></span></p>
                    <p><strong>Status:</strong> <span th:text="${order.status ?: 'N/A'}"></span></p>
                    <p><strong>Preferred Pickup Time:</strong>
                        <span th:if="${order.preferredPickupTime != null}" th:text="${#dates.format(order.preferredPickupTime, 'dd/MM/yyyy HH:mm')}"></span>
                        <span th:unless="${order.preferredPickupTime != null}">N/A</span>
                    </p>
                </div>
            </div>
            <hr>

            <form th:action="@{/receptionist/create-survey(orderId=${order.orderId})}" method="post">
                <div class="mb-3">
                    <label for="surveyor" class="form-label">Select Surveyor:</label>
                    <select id="surveyor" name="surveyorId" class="form-select" required>
                        <option value="">-- Choose a Surveyor --</option>
                        <option th:each="surveyor : ${availableSurveyors}"
                                th:value="${surveyor.surveyorId}"
                                th:text="${surveyor.fullName + ' (' + surveyor.areaOfCoverage + ')'}">Surveyor Name</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="surveyDate" class="form-label">Survey Date:</label>
                    <input type="date" id="surveyDate" name="surveyDate" class="form-control" th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}">
                    <small class="form-text text-muted">Ngày khảo sát mặc định là ngày hiện tại.</small>
                </div>

                <div class="mb-3">
                    <label for="surveyResults" class="form-label">Initial Survey Notes (Optional):</label>
                    <textarea id="surveyResults" name="surveyResults" class="form-control" rows="3" placeholder="Any initial notes for the surveyor..."></textarea>
                </div>

                <div class="btn-group mt-3">
                    <button type="submit" class="btn btn-primary">Create Survey</button>
                    <a th:href="@{/receptionist/dashboard}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
