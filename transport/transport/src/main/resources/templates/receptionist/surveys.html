<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Survey List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .survey-row { margin-bottom: 10px; }
        .action-btn { margin-right: 5px; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Danh Sách Khảo Sát</h2>
        <div class="mb-3">
            <a th:href="@{/receptionist/dashboard}" class="btn btn-secondary">Quay lại Dashboard</a>
            <a th:href="@{/logout}" class="btn btn-danger float-end">Đăng Xuất</a>
        </div>

        <!-- Hiển thị thông báo thành công -->
        <div th:if="${successMessage}" class="alert alert-success" role="alert">
            <span th:text="${successMessage}"></span>
        </div>

        <!-- Hiển thị thông báo lỗi -->
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <span th:text="${errorMessage}"></span>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Mã Đơn</th>
                    <th>Nhân Viên Khảo Sát</th>
                    <th>Nhân Viên Tiếp Nhận</th>
                    <th>Ngày Khảo Sát</th>
                    <th>Trạng Thái</th>
                    <th>Kết Quả</th>
                    <th>Ngày Tạo</th>
                    <th>Hành Động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="survey : ${surveys}" class="survey-row">
                    <td th:text="${survey.order.orderCode}"></td>
                    <td th:text="${survey.surveyor.fullName}"></td>
                    <td th:text="${survey.receptionist.fullName}"></td>
                    <td th:text="${#dates.format(survey.surveyDate, 'dd/MM/yyyy')}"></td>
                    <td>
                        <span th:class="${'badge ' + (survey.status == 'pending' ? 'bg-warning' : (survey.status == 'completed' ? 'bg-success' : 'bg-danger'))}"
                              th:text="${survey.status}"></span>
                    </td>
                    <td th:text="${survey.surveyResults != null ? survey.surveyResults : 'Chưa có'}"></td>
                    <td th:text="${#dates.format(survey.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <a th:href="@{/receptionist/edit-survey(surveyId=${survey.surveyId})}" 
                           class="btn btn-primary btn-sm action-btn">Chỉnh Sửa</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
