<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Receptionist Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .order-row { margin-bottom: 10px; }
        .action-btn { margin-right: 5px; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Receptionist Dashboard</h2>
        <div class="mb-3">
            <a th:href="@{/receptionist/list-surveys}" class="btn btn-info">Xem Danh Sách Khảo Sát</a>
            <a th:href="@{/logout}" class="btn btn-danger float-end">Đăng Xuất</a>
        </div>
        <!-- Hiển thị thông báo thành công -->
        <div th:if="${successMessage}" class="alert alert-success" role="alert">
            <span th:text="${successMessage}"></span>
        </div>

        <!-- Hiển thị thông báo lỗi -->
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <span th:text="${errorMessage}"></span>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Order Code</th>
                    <th>Pickup Address</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}" class="order-row">
                    <td th:text="${order.orderId}"></td>
                    <td th:text="${order.orderCode}"></td>
                    <td th:text="${order.pickupAddress}"></td>
                    <td th:text="${order.status}"></td>
                    <td>
    <span th:if="${order.hasSurveyActive}">
        <a th:href="@{/receptionist/create-survey-form(orderId=${order.orderId})}" class="btn btn-success btn-sm action-btn">Create Survey</a>
    </span>
    <span th:unless="${order.hasSurveyActive}">
        <a th:href="@{/receptionist/create-contract(orderId=${order.orderId})}" class="btn btn-primary btn-sm action-btn">Create Contract</a>
        <a th:href="@{/receptionist/view-order(orderId=${order.orderId})}" class="btn btn-info btn-sm action-btn">View OrderRequest</a>
    </span>
</td>

                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
